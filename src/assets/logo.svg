<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 118" width="420" height="118" role="img" aria-label="Save the Tigers">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A1F"/><stop offset="1" stop-color="#E8590C"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A1F"/><stop offset="1" stop-color="#E8590C"/></linearGradient>
    <filter id="glow" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
    <mask id="stripes"><rect width="64" height="64" fill="#fff"/><path d="M17 41 Q24 43 28 50 M47 41 Q40 43 36 50" stroke="#000" stroke-width="2.6" fill="none" stroke-linecap="round"/></mask>
    <!-- one eye, 240 x 130 box, left eye (inner corner lower right) -->
    <g id="eye">
      <path d="M0 30 C70 -5 190 35 240 105 C160 135 50 115 0 30Z" fill="#FF7A1A"/>
      <path d="M22 40 C80 12 175 42 214 98 C150 116 66 102 22 40Z" fill="#FFAB1F"/>
      <ellipse cx="116" cy="66" rx="9" ry="38" fill="#0a0d0a"/>
      <circle cx="90" cy="64" r="6" fill="#FFE9C9"/>
    </g>
  </defs>

  <!-- paw mark: main paw + faded second paw, as in the current site logo -->
  <g transform="translate(2 18) scale(1.1)">
    <g id="p1" transform="translate(0 6)">
      <g fill="url(#pg)">
        <ellipse cx="13" cy="27" rx="5.2" ry="7.2" transform="rotate(-24 13 27)"/>
        <ellipse cx="25" cy="16" rx="5.4" ry="7.8" transform="rotate(-9 25 16)"/>
        <ellipse cx="39" cy="16" rx="5.4" ry="7.8" transform="rotate(9 39 16)"/>
        <ellipse cx="51" cy="27" rx="5.2" ry="7.2" transform="rotate(24 51 27)"/>
        <path mask="url(#stripes)" d="M32 29 C41 29 49 37 49 46 C49 53 43.5 56.5 38 54.5 C34.5 53.3 29.5 53.3 26 54.5 C20.5 56.5 15 53 15 46 C15 37 23 29 32 29 Z"/>
      </g>
    </g>
    <g transform="translate(52 0) scale(.5625) rotate(18 70 18)" opacity=".3">
      <g fill="url(#pg)" transform="translate(-6 -2)">
        <ellipse cx="13" cy="27" rx="5.2" ry="7.2" transform="rotate(-24 13 27)"/>
        <ellipse cx="25" cy="16" rx="5.4" ry="7.8" transform="rotate(-9 25 16)"/>
        <ellipse cx="39" cy="16" rx="5.4" ry="7.8" transform="rotate(9 39 16)"/>
        <ellipse cx="51" cy="27" rx="5.2" ry="7.2" transform="rotate(24 51 27)"/>
        <path mask="url(#stripes)" d="M32 29 C41 29 49 37 49 46 C49 53 43.5 56.5 38 54.5 C34.5 53.3 29.5 53.3 26 54.5 C20.5 56.5 15 53 15 46 C15 37 23 29 32 29 Z"/>
      </g>
    </g>
  </g>

  <!-- eyes above "SAVE THE": pair is 570 wide in source units -> scaled to fit the text column -->
  <g transform="translate(124 2) scale(.33)">
    <g filter="url(#glow)" opacity=".85"><use href="#eye" transform="translate(0 0)"/><use href="#eye" transform="translate(570 0) scale(-1 1)"/></g>
    <use href="#eye"/>
    <use href="#eye" transform="translate(570 0) scale(-1 1)"/>
  </g>

  <text x="125" y="70" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="6.2" fill="#9db3a4">SAVE THE</text>
  <text x="123" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="900" letter-spacing="4.6" fill="url(#tg)">TIGERS</text>
</svg>
